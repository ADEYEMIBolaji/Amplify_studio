# Local dev convenience: brings up the frontend, backend, and worker.
# Supabase itself runs via `supabase start` (Supabase CLI) — not in this
# compose file — or against a hosted Supabase project; set SUPABASE_URL /
# DATABASE_URL in .env accordingly (see .env.example).
services:
  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./apps/api
    env_file: .env
    volumes:
      - ./apps/api:/app
    command: python -m app.worker.main
    depends_on:
      - api
